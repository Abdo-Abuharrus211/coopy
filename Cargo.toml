[package]
name = "coopy"
version = "0.1.0"
edition = "2024"
description = "A CLI tool to sync and manage content between Obsidian vaults and destination folders used for blogs, digital gardens, etc."

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34+deprecated"
toml = "1.1.0+spec-1.1.0"
clap = { version = "4.5.45", features = ["derive"] }